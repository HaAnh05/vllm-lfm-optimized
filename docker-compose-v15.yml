services:
  model:
    image: haanh05/vllm-lfm-optimized:v3
    entrypoint:
      - python3 #Don't change this to vllm-server
      - /app/entrypoint.py #Don't change this to vllm-server
    command:
      - --model=/model #Don't change this to vllm-server
      - --served-model-name=LFM2.5-1.2B-Instruct #Don't change this to vllm-server
      - --host=0.0.0.0 #Don't change this to vllm-server
      - --port=8000 #Don't change this to vllm-server
      - --max-model-len=8192
      - --max-num-seqs=75
      - --gpu-memory-utilization=0.96
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --kv-cache-dtype=fp8
      - --quantization=fp8
      - --enable-chunked-prefill
      - --max-num-batched-tokens=2048
      - --gdn-prefill-backend=cutedsl
      - --linear-backend=machete
      - --performance-mode=interactivity
      - --optimization-level=3
      - --no-enable-log-requests
      - --disable-log-stats
    ports:
      - "8000:8000"
    shm_size: "2g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
